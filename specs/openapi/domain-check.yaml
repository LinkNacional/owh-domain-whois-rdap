openapi: "3.1.0"
info:
  title: "OWH Domain WHOIS RDAP — API REST"
  version: "1.3.1"
  description: |
    Contratos de API REST e Webhooks do plugin OWH Domain WHOIS RDAP.
    Endpoints expostos via WordPress REST API (wp-json).

servers:
  - url: "https://{site}/wp-json/owh-domain-whois-rdap/v1"
    variables:
      site:
        default: "example.org"

# ──────────────────────────────────────
# Endpoints
# ──────────────────────────────────────

paths:

  # ── Domain Availability Check ──
  /check/{domain}:
    get:
      summary: "Verificar disponibilidade de domínio via RDAP"
      operationId: checkDomain
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,61}[a-zA-Z0-9]\.[a-zA-Z]{2,}$'
          example: "example.com"
      responses:
        "200":
          description: "Resultado da consulta RDAP"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - nonce: []

  # ── TLD List ──
  /tlds:
    get:
      summary: "Listar TLDs suportados (do dns.json IANA)"
      operationId: listTlds
      responses:
        "200":
          description: "Lista de TLDs com servidores RDAP"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TldEntry"
      security:
        - nonce: []

# ──────────────────────────────────────
# Schemas
# ──────────────────────────────────────

components:

  schemas:

    DomainResult:
      type: object
      required: [domain, isAvailable, statusSlug, message]
      properties:
        domain:
          type: string
          example: "example.com"
        isAvailable:
          type: boolean
        statusSlug:
          type: string
          enum: [available, registered, premium_reserved, invalid_format, tld_error, unsupported_tld, api_error, unknown]
        message:
          type: string
          example: "Disponível"
        rawData:
          type: object
          nullable: true

    TldEntry:
      type: object
      properties:
        tld:
          type: string
          example: "com"
        rdapServer:
          type: string
          format: uri
          example: "https://rdap.verisign.com/com/v1/"

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

  responses:

    BadRequest:
      description: "Requisição inválida"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    RateLimited:
      description: "Muitas requisições — aguarde"
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    nonce:
      type: apiKey
      in: header
      name: X-WP-Nonce
      description: "WordPress nonce (wp_create_nonce('wp_rest'))"
